[project]
name = "thaniverse"
version = "0.1.0"
description = "Thaniverse monorepo"
readme = "README.md"
authors = [
    { email = "thangbm@outlook.com" }
]
requires-python = ">=3.15"
# The root depends on every member, so a plain `uv sync` installs the whole workspace.
dependencies = [
    "py-core",
    "factory",
]

[tool.uv]
# The root is only the workspace's entry point. It has no code, so it is never built.
package = false

[tool.uv.workspace]
# Every directory matching these globs that has a pyproject.toml is a member.
members = ["apps/*", "packages/*"]

[tool.uv.sources]
# Resolve these names from the workspace, never from PyPI.
# Sources declared here apply to every member, so members do not repeat them.
py-core = { workspace = true }
factory = { workspace = true }
