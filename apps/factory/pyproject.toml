[project]
name = "factory"
version = "0.1.0"
description = "Thaniverse coding-agent factory (CLI)"
requires-python = ">=3.15"
dependencies = [
    "py-core",
    "openai>=3.46.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
factory = "factory.cli.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package folder sits next to pyproject.toml, not under src/.
module-root = ""
