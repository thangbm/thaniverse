[project]
name = "thaniverse-cli"
version = "0.1.0"
description = "Thaniverse CLI"
requires-python = ">=3.15"
dependencies = [
    "openai>=3.46.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
thaniverse = "thaniverse_cli.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "thaniverse_cli"
